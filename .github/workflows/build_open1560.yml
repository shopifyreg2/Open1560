name: build

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch: {}

env:
  PREMAKE_GENERATOR: vs2022
  BUILD_CONFIGURATION: Final
  BUILD_PLATFORM: Win32

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2
        with:
          msbuild-architecture: x86

      - name: Generate project files (Premake)
        run: tools/premake5.exe ${{ env.PREMAKE_GENERATOR }}

      - name: Build
        run: >
          msbuild /verbosity:minimal /nologo /m
          /p:Configuration="${{ env.BUILD_CONFIGURATION }}"
          /p:Platform="${{ env.BUILD_PLATFORM }}"
          "build/Open1560.sln"

      - name: Stage output into builds/
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path builds -Force | Out-Null
          Copy-Item -Path "build/output/*" -Destination "builds" -Recurse -Force

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Open1560-builds
          path: builds
          if-no-files-found: error
