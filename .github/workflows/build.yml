name: build

on: [push, pull_request]

env:
  PREMAKE_GENERATOR: vs2019
  BUILD_CONFIGURATION: Final
  GH_TOKEN: ${{github.token}}

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v3

    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v1.1
      with:
        msbuild-architecture: x86
      
    - name: Format Check
      run: python3 tools/format.py --dry

    - name: ASM Check
      run: python3 tools/asm.py

    - name: Premake
      run: tools/premake5.exe ${{env.PREMAKE_GENERATOR}} --MM1_GAME_DIRECTORY="${{github.workspace}}/build/output/"

    - name: Build
      run: msbuild /verbosity:minimal /nologo /m /p:Configuration="${{env.BUILD_CONFIGURATION}}" /p:Platform=Win32 "build/Open1560.sln"

    - name: Generate Summary
      run: python3 tools/asm.py >> $env:GITHUB_STEP_SUMMARY

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4.6.2
      with:
        name: Open1560
        path: build/output
        if-no-files-found: error

    - name: Update Release
      shell: pwsh
      run: |
        $stamp = (Get-Date).ToUniversalTime().ToString("yyyy-MM-dd_HH-mm-ss")
        7z a -tzip "artifacts/Open1560-$stamp.zip" "${{github.workspace}}/build/output/*"
        gh release create "build-$stamp" "artifacts/Open1560-$stamp.zip" `
          --repo "${{github.repository}}" `
          --target "${{github.sha}}" `
          --title "Open1560 build $stamp" `
          --notes "Built from commit ${{github.sha}}"
